[package]
name = "my_little_fs"
version = "0.1.1"
edition = "2024"
description = "内容寻址文件系统：CDC 分块 + blake3 寻址 + zstd 压缩 + redb 元数据"
repository = "https://github.com/ywnh1/my_little_fs"
license = "MIT"
keywords = ["filesystem", "content-addressed", "deduplication", "backup", "blake3"]
categories = ["filesystem", "data-structures"]
# AGENTS.md 是给协作代理看的内部说明，不进发布包
exclude = ["AGENTS.md"]

[features]
default = ["zstd", "tempfile"]

# ---- 压缩后端（可多选，写用选中的那个，读按块自带的标签分派）----

# zstd：压缩比与速度均衡，默认启用
zstd = ["dep:zstd", "compress"]
# gzip（deflate + gzip 封装）：兼容性最好，几乎哪都能解
gzip = ["dep:flate2", "compress"]
# brotli：压缩比最高，速度慢一些
brotli = ["dep:brotli", "compress"]
# lz4：极快，压缩比一般
lz4 = ["dep:lz4_flex", "compress"]
# snappy：快，压缩比一般
snappy = ["dep:snap", "compress"]

# 内部标记：只要启用了任意一个压缩后端就会打开它。
# 供 `with_compress` 等方法做 cfg 判断，不应该手动启用。
compress = []

# ---- 落盘方式 ----

# 原子落盘：先写同目录下的临时文件，再 rename 到目标位置，
# 避免掉电/崩溃留下写了一半的文件。关掉后直接写目标文件，
# 依赖也随之不编译（`temp_dir` 配置项同时消失）。
tempfile = ["dep:tempfile"]

[dependencies]
blake3 = { version = "1.8", features = ["serde"] }
fastcdc = "5.0"
postcard = { version = "1.1", features = ["use-std"] }
redb = "4.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
# 压缩后端全部可选，只开需要的那个
zstd = { version = "0.14", default-features = false, optional = true }
flate2 = { version = "1.1", default-features = false, features = [
    "rust_backend",
], optional = true }
brotli = { version = "8.0", optional = true }
lz4_flex = { version = "0.14", optional = true }
snap = { version = "1.1", optional = true }
tempfile = { version = "3.27", optional = true }

[dev-dependencies]
# 测试无论是否启用 `tempfile` feature 都要临时目录，所以这里恒定依赖一份
tempfile = "3.27"

[workspace]
# 库本身留在根目录，命令行界面单独一个 crate：
# 这样库的使用者不会被被动拉进 clap / figment 那一整套。
members = ["crates/mlfs"]
resolver = "3"
